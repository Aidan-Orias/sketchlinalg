[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchlinalg"
version = "0.1.0"
description = "Randomized sketching methods for fast linear models (least squares, ridge, preconditioned LSQR)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="YOUR NAME"}]
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "matplotlib",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: statistical checks that take longer than the basic test suite",
]
